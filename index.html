<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pretty Decent Apps</title>
<style>
  @font-face {
    font-family: 'Titan One';
    src: url('fonts/titan_one.ttf') format('truetype');
    font-display: swap;
  }
  :root { --bg: #0d0d12; --fg: #e8e8f0; --dim: #8a8aa0; --accent: #bb86fc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; padding: 2rem 1.25rem; max-width: 640px; margin: 0 auto; }
  h1 { font-family: 'Titan One', -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 2rem; margin-bottom: 0.25rem; font-weight: 400; }
  h1 .accent { color: var(--accent); }
  h1 .vivid { color: #D43FC7; } /* splash cycle peak: 305deg vivid violet */
  .tagline { color: var(--dim); margin-bottom: 2.5rem; }
  .app { border: 1px solid #2a2a35; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
  .app-header { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 0.75rem; }
  .app-header img { width: 56px; height: 56px; border-radius: 14px; }
  .app-header h2 { margin: 0; }
  .app h2 { font-size: 1.25rem; margin-bottom: 0.5rem; }
  .app p { color: var(--dim); margin-bottom: 0.75rem; }
  .app a { color: var(--accent); text-decoration: none; }
  .app a:hover { text-decoration: underline; }
  .links { margin-top: 0.5rem; font-size: 0.9rem; }
  .links a { margin-right: 1rem; }
  footer { margin-top: 3rem; color: var(--dim); font-size: 0.85rem; border-top: 1px solid #2a2a35; padding-top: 1rem; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
  <h1><span class="vivid">pretty</span> <span class="accent">decent</span></h1>
  <p class="tagline">APPS</p>

  <div class="app">
    <div class="app-header">
      <img src="images/offbeat-dj-icon.png" alt="offbeat dj icon">
      <h2>offbeat dj</h2>
    </div>
    <p>Your local music library, mixed like a live DJ set. Every track's tempo, key, energy, bass, and beat are analyzed on your device, then woven together with beat-matched crossfades.</p>
    <div class="links">
      <a href="privacy-offbeat-dj.html">Privacy Policy</a>
    </div>
  </div>

  <footer>
    &copy; 2026 Pretty Decent LLC &middot; <a href="mailto:pretty.decent.apps@gmail.com">Contact</a>
  </footer>
</body>
</html>
